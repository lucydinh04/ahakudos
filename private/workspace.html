/* Birthday suggestions from HR data */
.rail-intro{
  margin:0 0 11px;
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}
.hr-data-badge{
  color:#2F80D8;
  background:#EAF4FF;
  border-radius:999px;
  padding:5px 7px;
  font-size:13px;
  font-weight:700;
}
.birthday-list{display:grid;gap:8px}
.birthday-person{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) auto;
  align-items:center;
  gap:9px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:9px;
  background:#FBFDFF;
}
.birthday-avatar{background:linear-gradient(145deg,#FF9F5D,#FF7417)}
.birthday-info b{display:block;font-size:13px}
.birthday-info span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.birthday-info em{display:block;color:var(--orange);font-style:normal;font-size:13px;font-weight:700;margin-top:3px}
.birthday-send{
  border:1px solid #F7CBAE;
  background:var(--orange-soft);
  color:#B85B1F;
  border-radius:9px;
  padding:7px 8px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}

/* First KUDOS completed encouragement */
.first-kudos-done{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#FFF8EF 0%,#FFF 58%,#EEF7FF 100%);
  border-color:#F4D9C3;
  min-height:185px;
}
.first-kudos-done:after{
  content:"";
  position:absolute;
  width:105px;height:105px;border-radius:50%;
  right:-32px;bottom:-35px;
  background:rgba(255,116,23,.08);
}
.celebration-sticker{
  position:relative;
  width:72px;height:68px;
  margin:0 auto 8px;
  display:grid;place-items:center;
}
.celebration-sticker span{font-size:39px;filter:drop-shadow(0 6px 8px rgba(255,116,23,.16))}
.celebration-sticker i{position:absolute;font-style:normal;font-size:14px;color:var(--orange)}
.celebration-sticker i:nth-child(2){left:4px;top:10px}
.celebration-sticker i:nth-child(3){right:4px;top:3px;color:#2F80D8}
.celebration-sticker i:nth-child(4){right:10px;bottom:7px;color:#8B65D7}
.completion-copy{text-align:center;position:relative;z-index:1}
.completion-label{font-size:13px;letter-spacing:.1em;color:var(--orange);font-weight:800}
.completion-copy h3{margin:5px 0 5px;color:var(--navy);font-size:17px}
.completion-copy p{font-size:13px;line-height:1.6;color:var(--text);margin:0}
.point-rule-number{font-size:29px;color:var(--orange);font-weight:800}
.point-rule-number small{font-size:13px;color:var(--muted);font-weight:600}
.point-rule-copy{font-size:13px;color:var(--muted);line-height:1.55}

/* Card template selector */
.optional-label{font-weight:400;color:var(--muted);font-size:13px}
.template-gallery{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:2px 2px 8px;
  scrollbar-width:thin;
  scrollbar-color:#CBD8E6 transparent;
}
.template-option{
  border:0;
  background:transparent;
  padding:0;
  flex:0 0 112px;
  text-align:left;
}
.template-thumb{
  height:74px;
  border-radius:13px;
  border:2px solid transparent;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:9px;
  position:relative;
  overflow:hidden;
  box-shadow:0 5px 13px rgba(21,62,102,.07);
  transition:.18s ease;
}
.template-thumb:after{
  content:"";
  position:absolute;
  width:55px;height:55px;border-radius:50%;
  right:-18px;bottom:-21px;
  background:rgba(255,255,255,.35);
}
.template-thumb i{font-style:normal;font-size:18px;position:relative;z-index:1}
.template-thumb b{font-size:13px;position:relative;z-index:1}
.template-option em{display:block;font-style:normal;font-size:13px;color:var(--text);margin-top:5px;text-align:center}
.template-option.selected .template-thumb{
  border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(255,116,23,.12),0 7px 16px rgba(21,62,102,.09);
  transform:translateY(-1px);
}
.tpl-warm{background:linear-gradient(145deg,#FFF0E5,#FFF9F4);color:#A84F17}
.tpl-team{background:linear-gradient(145deg,#EAF4FF,#DDEEFF);color:#155A9F}
.tpl-inspire{background:linear-gradient(145deg,#F2ECFF,#E8DDFF);color:#7350B8}
.tpl-celebrate{background:linear-gradient(145deg,#FFF1DF,#FFE0BD);color:#B65B17}
.tpl-minimal{background:linear-gradient(145deg,#F7F9FC,#EDF2F7);color:#425875}
.tpl-birthday{background:linear-gradient(145deg,#FFF0F5,#FFE1EC);color:#B84C79}

/* Preview card themes */
.preview-message{
  position:relative;
  overflow:hidden;
  border-width:1px;
  transition:background .2s ease,border-color .2s ease;
}
.preview-message:after{
  content:"";
  position:absolute;
  width:120px;height:120px;border-radius:50%;
  right:-42px;bottom:-48px;
  background:rgba(255,255,255,.4);
  pointer-events:none;
}
.preview-message.tpl-warm{background:linear-gradient(145deg,#FFF5ED,#FFFDF9);border-color:#F5DCC9}
.preview-message.tpl-team{background:linear-gradient(145deg,#EEF7FF,#F9FCFF);border-color:#D4E7F8}
.preview-message.tpl-inspire{background:linear-gradient(145deg,#F6F0FF,#FCFAFF);border-color:#E4D8F7}
.preview-message.tpl-celebrate{background:linear-gradient(145deg,#FFF1DC,#FFF9EF);border-color:#F2D6AF}
.preview-message.tpl-minimal{background:linear-gradient(145deg,#F8FAFC,#FFFFFF);border-color:#DCE5EE}
.preview-message.tpl-birthday{background:linear-gradient(145deg,#FFF0F5,#FFF9FB);border-color:#F5CFDE}
.card-sticker{
  position:absolute;
  right:15px;
  top:14px;
  font-size:28px;
  z-index:2;
  filter:drop-shadow(0 5px 8px rgba(30,68,105,.12));
}
.preview-message .preview-logo,
.preview-message .kicker,
.preview-message h3,
.preview-message p,
.preview-message .value-tags{position:relative;z-index:2}

/* Success modal */
.success-first-modal{overflow:hidden}
.success-first-modal:before{
  content:"";
  position:absolute;
  width:170px;height:170px;border-radius:50%;
  right:-75px;top:-85px;background:rgba(255,116,23,.08);
}
.success-sticker{width:86px;height:78px;display:grid;place-items:center;margin:0 auto 6px;position:relative}
.success-sticker span{font-size:48px;filter:drop-shadow(0 8px 10px rgba(255,116,23,.17))}
.success-sticker i{position:absolute;font-style:normal;font-size:15px;color:var(--orange)}
.success-sticker i:nth-child(2){left:4px;top:11px}
.success-sticker i:nth-child(3){right:2px;top:7px;color:#2F80D8}
.success-sticker i:nth-child(4){right:11px;bottom:3px;color:#8B65D7}
.first-gift-note{
  display:flex;gap:10px;text-align:left;
  background:var(--orange-soft);
  border-radius:13px;padding:12px;margin:15px 0;
}
.first-gift-note>span{font-size:24px}
.first-gift-note b{font-size:13px;color:#8B4D1E}
.first-gift-note p{margin:3px 0 0;font-size:13px!important}

/* Responsive V2 */
@media(max-width:900px){
  .brand-logo{display:none}
  .sidebar-product-name{display:none}
  .brand-box:before{content:"A";display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--orange);font-weight:800;color:#fff}
  .birthday-person{grid-template-columns:36px 1fr}
  .birthday-send{grid-column:2;justify-self:start}
}
@media(max-width:620px){
  .brand-box:before{display:none}
  .template-option{flex-basis:104px}
  .template-thumb{height:70px}
}

   V3 FEEDBACK
   ========================================================= */
.profile-strip-simple{grid-template-columns:minmax(0,1fr) 260px;padding:16px 20px}
.profile-strip-simple .profile-intro{min-width:0}
.strip-score{border-left:1px solid var(--line);padding-left:24px}
.strip-score small{display:block;font-size:14px;color:var(--muted)}
.strip-score strong{display:block;font-size:30px;color:var(--navy);margin:4px 0 2px}
.profile-strip-simple .profile-intro b{font-size:18px;line-height:1.35}
.avatar-edit-wrap,.profile-avatar-edit{position:relative;flex:0 0 auto}
.avatar-media,.avatar-fallback{border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,#FF9A54,#FF6F12);color:#fff;font-weight:800;cursor:pointer}
.avatar-media img{width:100%;height:100%;object-fit:cover;transform-origin:center center}
.home-avatar{width:62px;height:62px;border:4px solid #FFF1E7;font-size:16px}
.avatar-edit-btn{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;box-shadow:0 4px 10px rgba(8,40,75,.18)}
.profile-big-avatar.avatar-media,.profile-big-avatar.avatar-fallback{width:78px;height:78px;margin:0 auto;font-size:20px}
.profile-avatar-btn{right:calc(50% - 42px);bottom:0}
.profile-avatar-link{border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:700;margin:-3px 0 12px}
.user-avatar-photo{overflow:hidden;padding:0}
.user-avatar-photo img{width:100%;height:100%;object-fit:cover;transform-origin:center}

.email-search-wrap{position:relative}
.email-search-icon{position:absolute;right:13px;top:11px;color:var(--navy);font-size:18px;pointer-events:none}
.recipient-suggestions{position:absolute;left:0;right:0;top:48px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 34px rgba(17,55,94,.14);padding:6px;max-height:280px;overflow:auto}
.recipient-suggestion{width:100%;border:0;background:#fff;display:grid;grid-template-columns:36px 1fr;gap:9px;text-align:left;align-items:center;padding:9px;border-radius:10px}
.recipient-suggestion:hover{background:#F4F8FC}
.recipient-suggestion b{display:block;font-size:14px;color:var(--ink)}
.recipient-suggestion span{display:block;font-size:13px;color:var(--blue);margin-top:2px}
.recipient-suggestion em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:2px}
.recipient-no-result{font-size:13px;color:var(--muted);padding:11px}
.selected-recipient{margin-top:8px;display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;border:1px solid #D7EAE0;background:#F7FCF9;border-radius:12px;padding:9px 10px}
.selected-recipient b{display:block;font-size:13px}
.selected-recipient span{display:block;font-size:13px;color:var(--blue);margin-top:2px}
.selected-recipient em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:2px}
.recipient-ok{font-size:13px!important;color:var(--green)!important;font-weight:700}
.recipient-preview em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:2px}

.ai-live-strip{background:linear-gradient(90deg,#F3EDFF,#EEF7FF)}
.live-badge{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;background:#fff;color:var(--green);font-size:13px;font-weight:800;border:1px solid #DDECE4}
.live-badge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(39,166,107,.11);animation:livePulse 1.6s infinite}
@keyframes livePulse{0%,100%{opacity:.55}50%{opacity:1}}

.email-delivery-note{display:flex;gap:10px;text-align:left;background:#EEF7FF;border:1px solid #D9EAF8;border-radius:13px;padding:12px;margin:15px 0 10px}
.email-delivery-note>span{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--blue);font-size:17px}
.email-delivery-note b{font-size:13px;color:var(--navy)}
.email-delivery-note p{margin:3px 0 0!important;font-size:13px!important}
.email-delivery-note strong{color:var(--blue)}
.completion-cta{margin-top:12px}

.avatar-modal{max-width:470px}
.avatar-editor-preview{width:180px;height:180px;border-radius:50%;margin:18px auto 14px;overflow:hidden;background:linear-gradient(145deg,#FF9A54,#FF6F12);display:grid;place-items:center;color:#fff;font-size:36px;font-weight:800;border:7px solid #FFF1E7;box-shadow:0 10px 24px rgba(255,116,23,.14)}
.avatar-editor-preview img{width:100%;height:100%;object-fit:cover;transform-origin:center}
.avatar-file-btn{width:max-content;margin:0 auto 14px;display:block;background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer}
.avatar-file-btn input{display:none}
.zoom-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:10px 0 18px}
.zoom-row label{font-size:13px;color:var(--muted)}
.zoom-row input{accent-color:var(--orange);width:100%}
.avatar-actions{display:flex;justify-content:flex-end;gap:8px}

@media(max-width:900px){
  .profile-strip-simple{grid-template-columns:1fr 210px}

/* =========================================================
   V5 FEEDBACK — Success banner after sending KUDOS
   ========================================================= */
.kudos-success-banner{
  position:fixed;
  z-index:180;
  top:22px;
  left:50%;

  transform:translate(-50%,-18px);
  opacity:0;
  display:grid;
  grid-template-columns:44px minmax(0,1fr) 34px;
  gap:12px;
  align-items:center;
  padding:14px 14px 14px 16px;
  border:1px solid #CFE8DA;
  border-radius:16px;
  background:rgba(255,255,255,.98);
  box-shadow:0 18px 45px rgba(18,56,91,.18);
  transition:opacity .22s ease,transform .22s ease;
  backdrop-filter:blur(12px);
}
.kudos-success-banner.show{
  opacity:1;
  transform:translate(-50%,0);
}
.success-banner-icon{
  width:44px;height:44px;
  border-radius:13px;
  display:grid;place-items:center;

  font-weight:800;
}
.success-banner-copy{
  min-width:0;
}
.success-banner-copy strong{
  display:block;
  color:var(--navy);
  font-size:16px;
  line-height:1.35;
}
.success-banner-copy span{
  display:block;
  margin-top:3px;
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.success-banner-copy span b{color:var(--blue)}
.success-banner-copy em{
  display:block;
  margin-top:4px;
  color:#B06022;
  font-size:14px;
  font-style:normal;
  font-weight:700;
}
.success-banner-close{
  width:32px;height:32px;
  border:0;
  border-radius:50%;
  background:#F0F4F7;
  color:#748397;
  font-size:18px;

/* ---- V24: real 3D background templates ---- */
/* Fallback tints for any legacy .tpl-* usage (e.g. Admin preview cards). */
.tpl-wish{background:#FBEEC6}
.tpl-move{background:#FBE1C6}
.tpl-birthday{background:#FBD9E5}
.tpl-tech{background:#D3E8FB}
/* Carousel thumbnail image fills the tile */
.kudos-compose-page .kudos-background-gallery .template-thumb .art-img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
/* Admin template gallery also shows the real image when present */
.admin-template-gallery .template-thumb .art-img{width:100%;height:100%;object-fit:cover;border-radius:inherit}

/* ===== V25: Admin email notifications ===== */
.hb-nav .nav-btn{position:relative}
.nav-badge{position:absolute;top:2px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#FF5A3C;color:#fff;font-size:10.5px;font-weight:800;line-height:17px;text-align:center;box-shadow:0 2px 6px rgba(255,90,60,.4)}
.admin-notify-page .notif-settings{padding:6px 4px;margin-bottom:16px}
.admin-notify-page .notif-set-row{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.admin-notify-page .notif-set-row:last-of-type{border-bottom:0}
.admin-notify-page .notif-set-row>div b{display:block;font-size:15px;color:var(--navy)}
.admin-notify-page .notif-set-row>div span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.admin-notify-page .notif-email{max-width:280px;height:42px}
.admin-notify-page .notif-hint{display:flex;gap:8px;font-size:13px;line-height:1.7;color:#6a7c93;background:#f7fafd;border-top:1px solid var(--line);padding:12px 16px}
.admin-notify-page .notif-count{font-size:13px;color:var(--muted);margin:0 4px 10px}
.admin-notify-page .notif-count b{color:#FF5A3C}
.admin-notify-page .notif-list{padding:6px}
.notif-row{display:flex;gap:12px;align-items:flex-start;padding:14px 14px;border-radius:14px;cursor:pointer;transition:background .12s ease}
.notif-row+.notif-row{border-top:1px solid var(--line)}
.notif-row:hover{background:#f8fafc}
.notif-row:focus-visible{outline:2px solid #0e4174;outline-offset:2px}
.notif-dot{width:9px;height:9px;border-radius:50%;background:transparent;margin-top:6px;flex:none}
.notif-row.unseen{background:#fff8f2}
.notif-row.unseen .notif-dot{background:#FF7F32}
.notif-main{flex:1;min-width:0}
.notif-top{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.notif-top b{font-size:14.5px;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notif-top time{font-size:12px;color:var(--muted);flex:none}
.notif-sub{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);margin:3px 0 6px}
.notif-main p{margin:0;font-size:13.5px;line-height:1.6;color:var(--text)}
.notif-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.notif-email-modal{max-width:640px;width:100%}
.notif-email-envelope{display:flex;flex-direction:column;gap:4px;background:#f7fafd;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0 12px;font-size:13px;color:#54657b}
.notif-email-envelope b{color:#405976}
.notif-email-sim{color:#9a5a1e;font-weight:600;font-size:12px}
.notif-email-frame{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;display:block;margin-bottom:14px}
@media(max-width:600px){
 .admin-notify-page .notif-set-row{flex-direction:column;align-items:stretch}
 .admin-notify-page .notif-email{max-width:none}
 .notif-actions{flex-direction:row;align-items:center}
}

/* ===== V26: First-KUDOS milestones ===== */
/* Banner chúc mừng người NHẬN KUDOS đầu tiên (đầu trang chủ) */
.first-recv-banner{display:flex;align-items:center;gap:14px;position:relative;
  background:linear-gradient(120deg,#FFF3E6 0%,#FFE7D0 55%,#FFE1EC 100%);
  border:1px solid #F6D9BE;border-radius:20px;padding:16px 46px 16px 18px;margin-bottom:18px;
  box-shadow:0 12px 30px rgba(255,127,50,.14)}
.first-recv-banner .frb-icon{font-size:30px;flex:none;line-height:1}
.first-recv-banner .frb-copy{flex:1;min-width:0}
.first-recv-banner .frb-copy b{display:block;font-size:16px;color:#0E4174;line-height:1.4}
.first-recv-banner .frb-copy span{display:block;font-size:13.5px;color:#7a6550;margin-top:3px;line-height:1.6}
.first-recv-banner .frb-open{flex:none;min-height:44px}
.first-recv-banner .frb-close{position:absolute;top:10px;right:12px;border:0;background:transparent;color:#9a8a76;font-size:20px;line-height:1;cursor:pointer;width:26px;height:26px;border-radius:50%}
.first-recv-banner .frb-close:hover{background:rgba(0,0,0,.06)}
@media(max-width:640px){.first-recv-banner{flex-wrap:wrap;padding-right:18px}.first-recv-banner .frb-open{width:100%}}
/* Nhấn nhẹ cho card "đã gửi KUDOS đầu tiên" ở rail */
.right-rail .first-kudos-done{background:linear-gradient(150deg,#FFF6EE,#FFEFE0);border-color:#F6D9BE}
/* Banner thành công khi gửi KUDOS ĐẦU TIÊN (celebratory) */
.kudos-success-banner.first-kudos-banner{border-color:#F6D9BE;box-shadow:0 16px 36px rgba(255,127,50,.24)}
.kudos-success-banner.first-kudos-banner .success-banner-icon{background:linear-gradient(145deg,#FFB27A,#FF7F32)!important;color:#fff!important}

/* ===== V27: first-KUDOS card illustrations (match reference) ===== */
.first-kudos-done .fk-party{width:78px;height:78px;margin:0 auto 6px;display:block}
.first-kudos-done .fk-party svg,.first-kudos-done .fk-party .fk-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(255,116,23,.18))}
.first-gift .fk-gift-icon{width:56px;height:56px;flex:none;background:#fff9f1;border:1px solid #F1D6C1;border-radius:16px;display:grid;place-items:center}
.first-gift .fk-gift-icon svg,.first-gift .fk-gift-icon .fk-svg{width:42px;height:42px;display:block}
.first-gift .gift-row{align-items:center}

 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),58000);

 if(isRecipient&&k.visibility==='public'){

function dashExportCsv(){
 const recs=dashFiltered();
 const CULT={fair:'Cong bang & Ton trong',share:'Hoc hoi & Chia se',grow:'Gan ket & Cung phat trien'};
 const head=['Thoi_gian_tao','Nguoi_gui','Phong_ban_gui','Nguoi_nhan','Phong_ban_nhan','Gia_tri_van_hoa','Pham_vi','Duyet_cong_khai','Kiem_duyet','Email','Noi_dung'];
 const esc=(v)=>{const s=String(v==null?'':v).replace(/"/g,'""');return /[",\n\r]/.test(s)?`"${s}"`:s;};
 const lines=[head.join(',')];
 recs.forEach(r=>{lines.push([r.createdAt||'',r.senderName||'',r.senderDept||'',r.recipientName||'',r.recipientDept||'',(r.values||[]).map(v=>CULT[v]||v).join(' | '),r.visibility||'',r.publicConsent||'',modStatusOf(r),r.emailStatus||'',String(r.message||'').replace(/\r?\n/g,' ')].map(esc).join(','));});
 const csv='﻿'+lines.join('\r\n');
 try{
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ahakudos_export_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);
  toast('Đã xuất '+recs.length+' KUDOS ra CSV.');
 }catch(e){toast('Không xuất được CSV: '+e.message);}
}
function bindAdminDashboard(){
 document.querySelectorAll('[data-dash-preset]').forEach(b=>b.addEventListener('click',()=>{
   const p=b.dataset.dashPreset,now=new Date(),iso=d=>d.toISOString().slice(0,10);
   if(p==='all'){dashFrom='';dashTo='';}
   else if(p==='month'){dashFrom=iso(new Date(now.getFullYear(),now.getMonth(),1));dashTo=iso(now);}
   else{const days=parseInt(p,10),from=new Date(now);from.setDate(now.getDate()-days+1);dashFrom=iso(from);dashTo=iso(now);}
   render();
 }));
 const apply=document.querySelector('#dash-apply');if(apply)apply.addEventListener('click',()=>{dashFrom=(document.querySelector('#dash-from').value||'');dashTo=(document.querySelector('#dash-to').value||'');render();});
 const exp=document.querySelector('#dash-export');if(exp)exp.addEventListener('click',dashExportCsv);
}

 return /^https:\/\//i.test(s)?s:'';
}

 if(save)save.addEventListener('click',async()=>{
   const payload={id:save.dataset.id||'',name:document.querySelector('#ev-name').value.trim(),url:document.querySelector('#ev-url').value.trim(),from:document.querySelector('#ev-from').value,to:document.querySelector('#ev-to').value,note:document.querySelector('#ev-note').value.trim(),active:document.querySelector('#ev-active').checked};

// ---- Handbook directory search + rules modal ------------------------------
function bindHandbookUI(){
 const input=document.querySelector('#hb-directory-search');
 const results=document.querySelector('#hb-directory-results');
 if(input&&results){
  const normalize=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toLowerCase();
  const hide=()=>{results.classList.add('hidden');input.setAttribute('aria-expanded','false');};
  input.addEventListener('input',()=>{
   const q=normalize(input.value.trim());
   if(!q){hide();return;}
   const pool=state.mode==='employee'?employees.filter(e=>e.email!==me().email):employees;
   const matches=pool.filter(e=>normalize(e.name+' '+e.email+' '+e.dept).includes(q)).slice(0,5);
   results.innerHTML=matches.length?matches.map(e=>`<button class="recipient-suggestion" data-directory-email="${e.email}"><div class="mini-avatar">${initials(e.name)}</div><div><b>${e.name}</b><span>${e.email}</span><em>${e.dept}</em></div><i aria-hidden="true">↗</i></button>`).join(''):'<div class="recipient-no-result">Không có đồng nghiệp phù hợp trong dữ liệu mẫu.</div>';
   results.classList.remove('hidden');input.setAttribute('aria-expanded','true');
   results.querySelectorAll('[data-directory-email]').forEach(btn=>btn.addEventListener('click',()=>{
    const email=btn.dataset.directoryEmail;
    if(state.mode==='employee'){state.prefillRecipient=email;state.selectedRecipient=personByEmail(email);state.page='send-kudos';render();}
    else{state.page='admin-recognition';render();const target=document.querySelector('#admin-recipient-email');target.value=email;target.dispatchEvent(new Event('input',{bubbles:true}));document.querySelector(`[data-admin-email="${email}"]`)?.click();}
    window.scrollTo(0,0);
   }));
  });
  input.addEventListener('keydown',e=>{if(e.key==='Escape')hide();if(e.key==='ArrowDown'){e.preventDefault();results.querySelector('button')?.focus();}});
  document.querySelector('.hb-directory').addEventListener('focusout',()=>setTimeout(()=>{if(!document.querySelector('.hb-directory')?.contains(document.activeElement))hide();},150));
 }
 document.querySelectorAll('.field').forEach(field=>{const label=field.querySelector('label');const control=field.querySelector('input[id],textarea[id],select[id]');if(label&&control)label.setAttribute('for',control.id);});
 const sendPreview=document.querySelector('#preview');
 if(sendPreview)sendPreview.addEventListener('click',()=>{const review=document.querySelector('#email-preview');review?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});document.querySelector('#email-review-title')?.focus({preventScroll:true});});
 const adminPreview=document.querySelector('#admin-recognition-preview');
 if(adminPreview)adminPreview.addEventListener('click',()=>{document.querySelector('.admin-recognition-preview')?.scrollIntoView({behavior:'smooth',block:'start'});});
 document.querySelectorAll('[data-modal="rules"]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="hb-rules-title"><button class="modal-close" aria-label="Đóng">×</button><div class="kicker">GỬI KUDOS</div><h2 id="hb-rules-title">Quy tắc ghi nhận</h2><div class="rules"><div class="rule"><b>Người nhận</b><span>Tìm và chọn đúng email Ahamove của đồng nghiệp.</span></div><div class="rule"><b>Nội dung</b><span>Chia sẻ hành động cụ thể, tác động tạo ra và điều đáng ghi nhận.</span></div><div class="rule"><b>Giá trị văn hóa</b><span>Chọn từ 1 đến 3 Giá trị văn hóa phù hợp.</span></div><div class="rule"><b>Phạm vi</b><span>Mặc định riêng tư. Công khai chỉ diễn ra khi người nhận đồng ý.</span></div></div><button class="btn primary wide hb-rules-close">Đã hiểu</button></div></div>`;
  document.querySelectorAll('.modal-close,.hb-rules-close').forEach(b=>b.addEventListener('click',()=>document.querySelector('#modal-root').innerHTML=''));
 }));

// ---- Bind ------------------------------------------------------------------
function bind(){
 if(state.mode==='employee'&&state.page==='employee-home'&&!sessionStorage.getItem('v28-vercel-self-ahakudos-intro-shown')){sessionStorage.setItem('v28-vercel-self-ahakudos-intro-shown','1');showEmployeeHomeIntroBanner();}
 document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{goToPage(b.dataset.page);}));
 document.querySelectorAll('[data-switch]').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.switch;state.page=state.mode==='employee'?'employee-home':'admin-home';render();window.scrollTo(0,0)}));
 const roleSel=document.querySelector('#demo-role-select');
 if(roleSel)roleSel.addEventListener('change',()=>{setCurrentUser(roleSel.value);state.page='employee-home';state.viewKudosId=null;render();window.scrollTo(0,0);});
 // open KUDOS detail
 document.querySelectorAll('[data-open-kudos]').forEach(el=>{
   const open=(e)=>{e.stopPropagation();openKudos(el.getAttribute('data-open-kudos'));};
   el.addEventListener('click',open);
   if(el.getAttribute('role')==='button')el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(e);}});
 });
 // consent + demo-become
 document.querySelectorAll('[data-consent]').forEach(b=>b.addEventListener('click',()=>handleConsent(b.dataset.kid,b.dataset.consent)));
 document.querySelectorAll('[data-become]').forEach(b=>b.addEventListener('click',()=>{setCurrentUser(b.dataset.become);state.viewKudosId=b.dataset.openAfter;state.page='kudos-detail';render();window.scrollTo(0,0);}));
 // fill kudos-detail iframe(s)
 document.querySelectorAll('[data-email-frame]').forEach(fr=>{const k=kudosById(fr.getAttribute('data-email-frame'));if(k){fr.srcdoc=buildReceiveEmail(k);sizeFrameOnLoad(fr);}});

 if(state.page==='send-kudos') bindSend();
 if(state.page==='public-feed') bindPublicFeed();
 if(state.page==='kudos-profile') bindTabs();
 if(state.page==='admin-recognition') bindAdminRecognition();
 if(state.page==='admin-ops') bindAdminMilestones();
 if(state.page==='admin-notify') bindAdminNotify();
 if(state.page==='admin-quality') bindAdminQuality();
 if(state.page==='admin-events') bindAdminEvents();
 if(state.page==='admin-home') bindAdminDashboard();
 document.querySelectorAll('[data-cta-route]').forEach(b=>b.addEventListener('click',()=>ctaGo(b.dataset.ctaRoute,b.dataset.ctaId)));
 if(state.mode==='employee'&&state.page==='employee-home') bindHome();
 document.querySelectorAll('.queue-actions button').forEach(b=>b.addEventListener('click',()=>{toast('Trạng thái duyệt minh họa, chưa lưu server.'); b.closest('.queue-item').style.opacity='.55'}));
 document.querySelectorAll('[data-birthday]').forEach(b=>b.addEventListener('click',()=>{state.prefillRecipient=b.dataset.birthday;state.selectedRecipient=personByEmail(b.dataset.birthday)||null;state.selectedTemplate='birthday';state.page='send-kudos';render();toast('Đã chọn đồng nghiệp và mẫu Sinh nhật. Hãy viết lời chúc.');}));
 document.querySelectorAll('[data-avatar-edit]').forEach(b=>b.addEventListener('click',openAvatarEditor));
 document.querySelectorAll('.toggle-on').forEach(b=>b.addEventListener('click',()=>{toast('Công tắc này chỉ là mô phỏng V27. Dùng Kiểm tra dữ liệu & email để hẹn lịch thử thật.');}));
 bindHandbookUI();
 bindPersonalTest();
}
function goToPage(page){state.page=page;if(page!=='kudos-detail')state.viewKudosId=null;render();window.scrollTo(0,0);}
function openKudos(id){state.viewKudosId=id;state.page='kudos-detail';try{history.replaceState(null,'','#/k/'+id);}catch(e){}render();window.scrollTo(0,0);}
async function handleConsent(id,action){
 try{const k=await rpc('doiDongY',id,me().email,action);takeRecord(k);render();toast(action==='approve'?'Đã lưu đồng ý chia sẻ vào Sheet.':'Đã lưu quyết định giữ riêng vào Sheet.');}
 catch(e){window.alert(e.message);}
}
function sizeFrameOnLoad(fr){
 const fit=()=>{try{const d=fr.contentDocument||fr.contentWindow.document;const h=d.body.scrollHeight;if(h)fr.style.height=(h+2)+'px';}catch(e){}};
 fr.addEventListener('load',fit);setTimeout(fit,120);setTimeout(fit,500);
}

}

function getSelectedMilestones(type=null){return [...document.querySelectorAll('[data-milestone-select]:checked')].filter(el=>!type||el.dataset.milestoneSelect===type).map(el=>({type:el.dataset.milestoneSelect,name:el.dataset.name,email:el.dataset.email,dept:el.dataset.dept,date:el.dataset.date,milestone:el.dataset.milestone||''}));}

>`).join('')}</div></div><div class="field"><label>Thời gian gửi</label><div class="bulk-schedule-options"><label class="bulk-schedule-option selected"><input type="radio" name="bulk-schedule" value="scheduled" checked><div><b>Theo ngày cột mốc</b><span>Gửi 09:00 đúng ngày Sinh nhật/Thâm niên của từng nhân sự.</span></div></label><label class="bulk-schedule-option"><input type="radio" name="bulk-schedule" value="now"><div><b>Gửi ngay</b><span>Gửi đồng loạt ngay sau khi xác nhận.</span></div></label></div></div></div><div class="bulk-preview-pane"><div class="bulk-preview-head"><div><div class="kicker">PREVIEW CÁ NHÂN HÓA</div><h3>Nội dung từng nhân sự sẽ nhận</h3></div><span id="bulk-preview-index">1 / ${selected.length}</span></div><div class="bulk-preview-person" id="bulk-preview-person"><div class="mini-avatar">${initials(selected[0].name)}</div><div><b>${selected[0].name}</b><span>${selected[0].email}</span><em>${selected[0].dept}</em></div><span class="personalized-badge">Cá nhân hóa</span></div><div class="preview-message tpl-${defaultTemplate}" id="bulk-preview-card"><div class="card-sticker" id="bulk-preview-sticker">${defaultSticker}</div><div class="preview-logo">${logo(true)}</div><div class="kicker">${singleType==='birthday'?'AHAKUDOS · HAPPY BIRTHDAY':'AHAKUDOS · CỘT MỐC ĐÁNG NHỚ'}</div><h3 id="bulk-preview-title">${personalizeMilestoneCopy(defaultTitle,selected[0])}</h3><p id="bulk-preview-text">${personalizeMilestoneCopy(defaultMessage,selected[0])}</p><div class="preview-visibility private">● Chỉ người nhận biết</div></div><div class="bulk-preview-nav"><button class="btn secondary" id="bulk-prev-person">← Người trước</button><button class="btn secondary" id="bulk-next-person">Người tiếp theo →</button></div><div class="bulk-recipient-list"><div class="bulk-list-head"><b>Danh sách nhận</b><span>${selected.length} nhân sự</span></div><div class="bulk-list-scroll">${selected.map(x=>`<div><span>${x.name}</span><em>${x.type==='birthday'?'Sinh nhật '+x.dat // ---- Compose binding + coach + single-source preview ----------------------
function qualityCoach(text,ctx){
 // Rule-based WRITING COACH (bản thử nghiệm) — surfaces ONE most-useful nudge.
 // Never scores, never blocks, never claims to verify sincerity. Swappable for a
 // real model later: keep signature (text, ctx) -> {nudge, note}.
 const low=(text||'').toLowerCase();
 const name=ctx&&ctx.recipientFirst?ctx.recipientFirst:'';
 const len=(text||'').trim().length;
 const hasAction=/(đã|chủ động|hỗ trợ|chia sẻ|xử lý|chuẩn bị|phối hợp|hoàn thành|hướng dẫn|giải thích|tổng hợp|kết nối)/i.test(low);
 const hasImpact=['nhờ','giúp','kịp','tránh','hoàn thành','hiệu quả','cải thiện','tăng','giảm','đúng hạn','tốt hơn','nhanh hơn','rõ hơn'].some(w=>low.includes(w));
 const hasHeart=['cảm ơn','trân trọng','biết ơn','tận tâm','quý','ấn tượng'].some(w=>low.includes(w));
 let nudge;
 if(len===0){nudge=`Bắt đầu bằng một hành động cụ thể bạn thấy${name?` ở ${name}`:''} — điều gì khiến bạn muốn cảm ơn?`;}
 else if(len<25||!hasAction){nudge=`Hãy kể một <b>hành động cụ thể</b>${name?` mà ${name} đã làm`:''} thay vì chỉ nói cảm ơn chung chung.`;}
 else if(!hasImpact){nudge=`Điều đó đã <b>giúp gì</b> cho bạn, đội nhóm hoặc công việc? Một chi tiết về tác động sẽ khiến lời ghi nhận đáng nhớ hơn.`;}
 else if(!hasHeart){nudge=`Bạn có thể thêm một câu về <b>điều bạn thật sự trân trọng</b> ở họ.`;}
 else{nudge=`Lời ghi nhận của bạn đã khá cụ thể và ấm áp. Khi thấy ổn, bạn có thể gửi.`;}
 return {nudge};
}

}
function openAvatarEditor(){
 let tempData=state.avatarData;let tempScale=state.avatarScale;
 document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal avatar-modal"><button class="modal-close avatar-cancel">×</button><div class="kicker">HỒ SƠ CÁ NHÂN</div><h2>Cập nhật ảnh đại diện</h2><p>Chọn ảnh của bạn và điều chỉnh mức zoom để căn khung theo ý muốn.</p><div class="avatar-editor-preview" id="avatar-preview">${tempData?`<img src="${tempData}" alt="Ảnh đại diện xem trước" style="transform:scale(${tempScale})">`:`<span>${initials(me().name)}</span>`}</div><label class="avatar-file-btn">Chọn ảnh<input id="avatar-file" type="file" accept="image/*"></label><div class="zoom-row"><label for="avatar-zoom">Thu nhỏ</label><input id="avatar-zoom" type="range" min="0.8" max="2.4" step="0.05" value="${tempScale}"><label>Phóng to</label></div><div class="avatar-actions"><button class="btn secondary avatar-cancel">Hủy</button><button class="btn primary" id="avatar-save">Lưu ảnh</button></div></div></div>`;
 const file=document.querySelector('#avatar-file');const zoom=document.querySelector('#avatar-zoom');const preview=document.querySelector('#avatar-preview');
 const draw=()=>{preview.innerHTML=tempData?`<img src="${tempData}" alt="Ảnh đại diện xem trước" style="transform:scale(${tempScale})">`:`<span>${initials(me().name)}</span>`;};
 file.addEventListener('change',()=>{const f=file.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{tempData=String(reader.result);tempScale=1;zoom.value='1';draw()};reader.readAsDataURL(f);});
 zoom.addEventListener('input',()=>{tempScale=Number(zoom.value);draw()});
 document.querySelectorAll('.avatar-cancel').forEach(b=>b.addEventListener('click',()=>document.querySelector('#modal-root').innerHTML=''));
 document.querySelector('#avatar-save').addEventListener('click',()=>{state.avatarData=tempData;state.avatarScale=tempScale;if(tempData)localStorage.setItem('v28-vercel-self-ahakudos-avatar',tempData);else localStorage.removeItem('v28-vercel-self-ahakudos-avatar');localStorage.setItem('v28-vercel-self-ahakudos-avatar-scale',String(tempScale));document.querySelector('#modal-root').innerHTML='';render();toast('Đã cập nhật ảnh đại diện.');});
}
function toast(text){const t=document.createElement('div');t.className='toast';t.textContent=text;document.querySelector('#toast-root').appendChild(t);setTimeout(()=>t.remove(),2200)}

// ---- Deep link (#/k/<id>) --------------------------------------------------
function handleDeepLink(){
 const m=(location.hash||'').match(/#\/k\/([A-Za-z0-9_-]+)/)||(!window.v27DeepLinkUsed&&BOOT.initialId?[null,BOOT.initialId]:null);window.v27DeepLinkUsed=true;
 if(m){state.mode='employee';state.page='kudos-detail';state.viewKudosId=m[1];return true;}
 return false;
}
window.addEventListener('hashchange',()=>{if(handleDeepLink())render();});

// ---- Boot ------------------------------------------------------------------
applyMyReactions();
handleDeepLink();
render();
})();

</script>
